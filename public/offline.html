<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin Conexión — TechField</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f4;
      color: #1c1917;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      border: 2px solid #d6d3d1;
      border-radius: 1.5rem;
      padding: 2rem 1.5rem;
      max-width: 420px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .icon-container {
      width: 4rem;
      height: 4rem;
      background: #fef3c7;
      border: 2px solid #f59e0b;
      border-radius: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
      color: #78350f;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      color: #0c0a09;
    }
    p {
      color: #57534e;
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    button {
      background: #15803d;
      color: #ffffff;
      border: 2px solid #14532d;
      padding: 0.85rem 2rem;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #166534;
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M8.288 8.288A12.012 12.012 0 0112 7.5c3.21 0 6.13 1.258 8.293 3.308m-4.22 4.22A6.712 6.712 0 0112 14.25c-1.39 0-2.678.423-3.743 1.148M12 18a.75.75 0 110-1.5.75.75 0 010 1.5z" />
      </svg>
    </div>
    <h1>Sin conexión a internet</h1>
    <p>La aplicación está en <strong>Modo Campo</strong>. Tus reportes registrados siguen seguros en este teléfono y se enviarán cuando recuperes señal.</p>
    <button onclick="window.location.reload()">Reintentar conexión</button>
  </div>
</body>
</html>
